<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeLife · Your Memories. Your Documents. Your Safety.</title>
  <meta name="description" content="SafeLife: encrypted personal document vault and AapdaSense disaster awareness for India." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 27 7v8c0 7-5 11-11 14C10 26 5 22 5 15V7z' fill='%234b2fd6'/%3E%3Cpath d='M16 10l6 5v7h-4v-4h-4v4h-4v-7z' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <!-- Sign in / sign up -->
  <div id="auth" class="auth" hidden></div>

  <!-- Signed-in application shell -->
  <div id="shell" class="app" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="logo" id="logo"></div>
      <nav id="nav" class="stack" style="gap:4px"></nav>
      <div class="side-card">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#4b2fd6" stroke-width="2"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
        <b>Be Prepared.</b>
        <span class="small muted">Stay Protected.</span>
      </div>
    </aside>

    <div>
      <main class="main">
        <div class="topbar">
          <button class="menu-toggle" id="menuBtn" aria-label="Open menu">☰</button>
          <div class="search">
            <span class="muted">🔍</span>
            <input id="searchBox" placeholder="Search pages, documents, alerts…" aria-label="Search" />
          </div>
          <div class="grow"></div>
          <div class="bell" id="bell" title="Alerts"><span>🔔</span><span class="dot" id="bellCount" hidden>0</span></div>
          <div class="row" id="userChip"></div>
        </div>
        <div id="view"></div>
        <p class="footer-note" id="footer"></p>
      </main>
    </div>
  </div>

  <div class="toast-host" id="toasts"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="js/vault-crypto.js"></script>
  <script src="js/api.js"></script>
  <script src="js/views-auth.js"></script>
  <script src="js/views-main.js"></script>
  <script src="js/views-vault.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
